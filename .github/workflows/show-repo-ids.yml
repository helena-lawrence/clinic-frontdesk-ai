name: Show GitHub Repository IDs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  show-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Display repository IDs
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          echo "OWNER_ID=$OWNER_ID"
          echo "REPO_ID=$REPO_ID"
