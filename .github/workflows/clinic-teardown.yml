name: Clinic Front Desk - Terraform teardown

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview, repair the missing clinic secret entry and preview, or destroy
        type: choice
        options: [preview, repair-and-preview, destroy]
        default: preview
        required: true
      confirmation:
        description: For destroy, type DELETE clinic-frontdesk-managed (includes DB, users and images)
        type: string
        required: false

concurrency:
  group: clinic-production
  cancel-in-progress: false

jobs:
  teardown:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: aws/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check deletion confirmation
        if: inputs.operation == 'destroy'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DELETE clinic-frontdesk-managed" ]]; then
            echo "::error::Type DELETE clinic-frontdesk-managed to authorize deletion."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          allowed-account-ids: "202506667107"
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: clinic-teardown
      - name: Initialize the production state
        run: |
          cp teardown/teardown_override.tf ./teardown_override.tf
          terraform init -input=false
      - name: Forget the confirmed missing secret rotation entry
        if: inputs.operation == 'repair-and-preview'
        run: |
          set -euo pipefail
          rotation=aws_secretsmanager_secret_rotation.clinic_master
          # CloudShell independently confirmed ResourceNotFoundException for this exact ARN.
          missing_secret='arn:aws:secretsmanager:eu-west-2:202506667107:secret:rds!db-5826ae7c-d34b-46b1-9467-6ce7781b516f-BDiAPy'
          addresses=$(terraform state list)
          if ! grep -Fxq "$rotation" <<< "$addresses"; then
            echo "Rotation entry already absent. Continuing to preview."
            exit 0
          fi
          tracked=$(terraform state list -id="$missing_secret" "$rotation")
          db_count=$(aws rds describe-db-instances --region eu-west-2 \
            --filters Name=db-instance-id,Values=clinic-frontdesk-managed-db \
            --query 'length(DBInstances)' --output text)
          if [[ "$tracked" != "$rotation" || "$db_count" != 0 ]]; then
            echo "::error::The secret binding or database no longer matches the confirmed missing resources."
            exit 1
          fi
          terraform state rm -lock-timeout=5m "$rotation"
      - name: Plan deletion from the production state
        run: terraform plan -destroy -lock-timeout=5m -out="$RUNNER_TEMP/destroy.plan"
      - name: Generate IAM permissions for review
        if: inputs.operation == 'preview' || inputs.operation == 'repair-and-preview'
        run: |
          umask 077
          terraform show -json "$RUNNER_TEMP/destroy.plan" > "$RUNNER_TEMP/clinic-plan.json"
          if jq -e 'any(.resource_changes[]?; .mode == "managed" and .change.actions == ["delete"])' "$RUNNER_TEMP/clinic-plan.json" >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/iam-tools"
            "$RUNNER_TEMP/iam-tools/bin/pip" install --quiet 'iam-policy-autopilot==0.4.0'
            "$RUNNER_TEMP/iam-tools/bin/iam-policy-autopilot" generate-policies "$RUNNER_TEMP/clinic-plan.json" \
              --region eu-west-2 --account 202506667107 --pretty
          fi
      - name: Prepare existing resources and apply the destroy plan
        if: inputs.operation == 'destroy'
        run: bash ../../.github/scripts/teardown-clinic.sh
