name: Clinic Front Desk - CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the fresh AWS foundation before publishing images
        type: boolean
        default: false
        required: true
      patient_email:
        description: Optional email to invite and link to synthetic patient P001
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: clinic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_DIR: aws/terraform
  API_ECR_REPO: clinic-frontdesk-managed-api
  UI_ECR_REPO: clinic-frontdesk-managed-ui
  PREDICTOR_ECR_REPO: clinic-frontdesk-managed-predictor

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject tracked local secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '.env must not be tracked.' >&2
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.aws/|\.(p12|pfx|key)$'; then
            echo 'A potential credential file is tracked.' >&2
            exit 1
          fi
      - run: python -m compileall -q app scripts
      - run: docker build --file Dockerfile.api --tag clinic-api:ci .
      - run: docker build --file Dockerfile.ui --tag clinic-ui:ci .

  terraform_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check
        working-directory: aws/terraform
      - run: terraform init -backend=false -input=false
        working-directory: aws/terraform
      - run: terraform validate
        working-directory: aws/terraform

  foundation:
    needs: [validate, terraform_validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.bootstrap == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: clinic-foundation
      - name: Create Terraform-managed AWS foundation
        working-directory: aws/terraform
        run: |
          terraform init -input=false
          if terraform state list | grep -q '^aws_ecs_service\.'; then
            echo 'Services already exist. Run a normal deployment instead of bootstrap.' >&2
            exit 1
          fi
          terraform apply -input=false -auto-approve -var='enable_services=false'
          terraform output https_url

  publish:
    needs: [validate, terraform_validate, foundation]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (vars.ENABLE_ECS_DEPLOY == 'true' || inputs.bootstrap == true) &&
      needs.validate.result == 'success' &&
      needs.terraform_validate.result == 'success' &&
      (needs.foundation.result == 'success' || needs.foundation.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: clinic-publish
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Train a fresh synthetic predictor artifact
        run: |
          python -m pip install -r deployment/ml_lambda/requirements.txt
          python scripts/generate_no_show_data.py
          python -m app.ml.train_model
          cp app/ml/models/no_show_model.joblib deployment/ml_lambda/no_show_model.joblib
      - name: Push commit-tagged images
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          push_if_missing() {
            local repo="$1" dockerfile="$2" context="$3"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$repo:$GITHUB_SHA already exists"
              return
            fi
            docker build -f "$dockerfile" -t "$REGISTRY/$repo:$GITHUB_SHA" "$context"
            docker push "$REGISTRY/$repo:$GITHUB_SHA"
          }
          push_if_missing "$API_ECR_REPO" Dockerfile.api .
          push_if_missing "$UI_ECR_REPO" Dockerfile.ui .
          push_if_missing "$PREDICTOR_ECR_REPO" deployment/ml_lambda/Dockerfile deployment/ml_lambda

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: clinic-deploy
      - name: Create or update ECS services and predictor
        working-directory: aws/terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -var='enable_services=true' -var="image_tag=$GITHUB_SHA"
          terraform output https_url
      - name: Initialize the new database once
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap == true
        shell: bash
        working-directory: aws/terraform
        run: |
          set -euo pipefail
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASK=$(terraform output -raw init_task_definition_arn)
          SG=$(terraform output -raw task_security_group_id)
          SUBNETS=$(terraform output -json task_subnet_ids | jq -r 'join(",")')
          NETWORK="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}"
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "$TASK" --network-configuration "$NETWORK" --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != None
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = 0
      - name: Invite and link a synthetic demo patient
        if: github.event_name == 'workflow_dispatch' && inputs.patient_email != ''
        shell: bash
        working-directory: aws/terraform
        env:
          PATIENT_EMAIL: ${{ inputs.patient_email }}
        run: |
          set -euo pipefail
          POOL=$(terraform output -raw cognito_user_pool_id)
          if ! aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "$PATIENT_EMAIL" >/dev/null 2>&1; then
            aws cognito-idp admin-create-user --user-pool-id "$POOL" --username "$PATIENT_EMAIL" --user-attributes "Name=email,Value=$PATIENT_EMAIL" --desired-delivery-mediums EMAIL >/dev/null
          fi
          SUB=$(aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "$PATIENT_EMAIL" --query "UserAttributes[?Name=='sub'].Value | [0]" --output text)
          test "$SUB" != None
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASK=$(terraform output -raw init_task_definition_arn)
          SG=$(terraform output -raw task_security_group_id)
          SUBNETS=$(terraform output -json task_subnet_ids | jq -r 'join(",")')
          NETWORK="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}"
          OVERRIDES=$(jq -n --arg pool "$POOL" --arg sub "$SUB" '{containerOverrides:[{name:"init",command:["python","-m","scripts.enroll_managed_patient"],environment:[{name:"COGNITO_USER_POOL_ID",value:$pool},{name:"COGNITO_SUB",value:$sub},{name:"PATIENT_ID",value:"P001"}]}]}')
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "$TASK" --network-configuration "$NETWORK" --overrides "$OVERRIDES" --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != None
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = 0
      - name: Wait for both ECS services
        shell: bash
        working-directory: aws/terraform
        run: |
          aws ecs wait services-stable --cluster "$(terraform output -raw ecs_cluster_name)" --services "$(terraform output -raw api_service_name)" "$(terraform output -raw ui_service_name)"
          terraform output https_url
